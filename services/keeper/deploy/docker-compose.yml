# FlipTheMeme keeper (devnet) on the VPS. Deploy steps: README.md in this folder.
# Outbound connections only (devnet RPC, mainnet RPC, GeckoTerminal); no ports, no DNS, no Caddy.
# Optional overrides go into a .env file next to this one (compose reads it automatically).
#
# The explicit project name matters: without it compose names the project after this folder,
# "deploy", which is the name of the memepred compose project on the same VPS.
name: ftm-sol-keeper

services:
  ftm-sol-keeper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ftm-sol-keeper:latest
    container_name: ftm-sol-keeper
    restart: unless-stopped
    mem_limit: 256m
    # The keeper waits for transactions in flight before it exits on SIGTERM.
    stop_grace_period: 40s
    environment:
      DEVNET_RPC: ${DEVNET_RPC:-https://api.devnet.solana.com}
      MAINNET_RPCS: ${MAINNET_RPCS:-https://api.mainnet-beta.solana.com,https://solana-rpc.publicnode.com}
      HOUSE_ROUND_CAP_LAMPORTS: ${HOUSE_ROUND_CAP_LAMPORTS:-50000000}
      HOUSE_DAILY_BUDGET_LAMPORTS: ${HOUSE_DAILY_BUDGET_LAMPORTS:-2000000000}
      # Upgrade of October 2026 (README.md, "Program upgrade"); empty = the keeper key does it all,
      # no attestor, positions closed a day after their round.
      ATTEST_URL: ${ATTEST_URL:-}
      # The attestor Worker's shared secret (sent as a bearer token; never logged).
      ATTEST_TOKEN: ${ATTEST_TOKEN:-}
      PRICE_KEYPAIR: ${PRICE_KEYPAIR:-}
      HOUSE_KEYPAIR: ${HOUSE_KEYPAIR:-}
      CLOSE_AFTER_SECS: ${CLOSE_AFTER_SECS:-}
      POOL_OVERRIDE: ${POOL_OVERRIDE:-}
      # Token choice; empty = the keeper's defaults (deploy/README.md, Configuration).
      POOL_MIN_AGE_MIN: ${POOL_MIN_AGE_MIN:-}
      POOL_MAX_AGE_MIN: ${POOL_MAX_AGE_MIN:-}
      POOL_MIN_TX_M5: ${POOL_MIN_TX_M5:-}
      POOL_HOLD_MIN: ${POOL_HOLD_MIN:-}
      POOL_SWITCH_RATIO: ${POOL_SWITCH_RATIO:-}
      POOL_KEEP_MIN_TX_M5: ${POOL_KEEP_MIN_TX_M5:-}
      POOL_KEEP_MAX_AGE_MIN: ${POOL_KEEP_MAX_AGE_MIN:-}
      # pump.fun graduates only (mint ends in "pump"); pools made on PumpSwap directly get drained fast.
      POOL_PUMP_ONLY: ${POOL_PUMP_ONLY:-true}
    volumes:
      - ./data:/data
      # The whole folder: keeper.json, plus price.json and house.json after split-roles.ts
      # (then PRICE_KEYPAIR=/secrets/price.json and HOUSE_KEYPAIR=/secrets/house.json in .env).
      - ./secrets:/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
