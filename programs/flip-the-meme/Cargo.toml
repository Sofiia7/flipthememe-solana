[package]
name = "flip-the-meme"
version = "0.1.0"
description = "Shared-round parimutuel prediction arena"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "flip_the_meme"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
