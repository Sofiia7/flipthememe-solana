name: Reproducible program
on:
  pull_request:
    paths:
      - 'programs/**'
      - 'packages/client/**'
      - 'Cargo.*'
      - 'Anchor.toml'
      - '.github/workflows/program.yml'
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - 'packages/client/**'
      - 'Cargo.*'
      - 'Anchor.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Two clean SBF builds, IDL and tests of the identical binary
        run: bash programs/flip-the-meme/build-verifiable.sh
      - uses: actions/upload-artifact@v7
        with:
          name: verified-program
          path: |
            dist/program/a/flip_the_meme.so
            dist/program/a/flip_the_meme.json
            dist/program/SHA256SUMS
            dist/program/source-commit.txt
            dist/program/build-image.txt
